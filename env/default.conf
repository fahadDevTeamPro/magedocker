upstream fastcgi_backend {
  server unix:/sock/docker.sock;
}

server {
  listen 8000;
  return 301 https://$host$request_uri;
}


map $http_host $MAGE_RUN_CODE {
    promedxpress-local.scripco.com promedxpress;
    allegromedical-local.scripco.com allegromedical;
    bb-magento-local.scripco.com scriphessco;
    scriphessco-local.scripco.com scriphessco;
    bodyworkmall-local.scripco.com bodyworkmall;
    massagewarehouse-local.scripco.com massagewarehouse;
    advantagemedical-local.scripco.com advantagemedical;
}
server {
  listen [::]:8443 ssl http2 ipv6only=on;
  listen 8443 ssl http2;

  ssl_certificate /etc/nginx/certs/nginx.crt;
  ssl_certificate_key /etc/nginx/certs/nginx.key;

  set $MAGE_ROOT /var/www/html;
  
  set $MAGE_MODE developer;
  set $MAGE_RUN_TYPE website;

  fastcgi_buffer_size 64k;
  fastcgi_buffers 8 128k;

  include /var/www/html/nginx[.]conf;
}

