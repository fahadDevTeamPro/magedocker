      #- ./src:/var/www/html:delegated
      #- ./env/env.php:/var/www/html/app/etc/env.php:delegated
      #- ./env/nginx-sample.conf:/var/www/html/nginx.conf:delegated
      - ./src/nginx.conf.sample:/var/www/html/nginx.conf:cached
      #- ./env/default.conf:/etc/nginx/conf.d/default.conf:delegated
      - ./src:/var/www/html:delegated
      - ./env/env.php:/var/www/html/app/etc/env.php:delegated
      #- ./env/nginx-sample.conf:/var/www/html/nginx.conf:delegated
      - ./env/default.conf:/etc/nginx/conf.d/default.conf:delegated
      - ./env/php.ini.sample:/usr/local/etc/php/php.ini:delegated
